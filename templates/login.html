<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>YunPan - 登录</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="grain"></div>
<div class="login-page">
  <div class="login-card">
    <div class="login-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </div>
    <h1 class="login-title">YunPan</h1>
    <p class="login-desc">输入密码以访问文件服务器</p>
    <form id="login-form" class="login-form">
      <div class="input-group">
        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="password" name="password" class="input" placeholder="请输入密码" autofocus autocomplete="current-password">
      </div>
      <p id="login-error" class="login-error"></p>
      <button type="submit" class="btn btn-primary btn-full" id="login-btn">
        <span class="btn-text">登 录</span>
        <span class="btn-spinner hidden">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
            <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
          </svg>
        </span>
      </button>
    </form>
  </div>
</div>
<div class="grain"></div>
<script src="/static/js/app.js"></script>
</body>
</html>
