<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>YunPan</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div id="app" class="app">
  <header class="header">
    <div class="header-left">
      <button id="btn-back" class="btn-icon" title="返回">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="breadcrumbs" id="breadcrumbs"></div>
    </div>
    <div class="header-right">
      <button id="btn-logout" class="btn-icon" title="退出">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="main">
    <div id="loading" class="loading hidden">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
        <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
      </svg>
    </div>

    <div id="empty" class="empty hidden">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
      </svg>
      <p class="empty-text">暂无文件</p>
      <p class="empty-hint">点击下方按钮上传文件</p>
    </div>

    <div id="file-list" class="file-list hidden"></div>
  </main>

  <div class="bottom-bar">
    <div class="disk-info" id="disk-info"></div>
    <div class="bottom-actions">
      <button id="btn-upload" class="btn-fab" title="上传文件">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
      <button id="btn-mkdir" class="btn-icon btn-icon-lg" title="新建文件夹">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          <line x1="12" y1="11" x2="12" y2="17"/>
          <line x1="9" y1="14" x2="15" y2="14"/>
        </svg>
      </button>
    </div>
  </div>

  <input type="file" id="file-input" class="hidden" multiple>
</div>

<div id="toast" class="toast hidden"></div>
<div id="dialog-overlay" class="dialog-overlay hidden">
  <div class="dialog" id="dialog">
    <p class="dialog-msg" id="dialog-msg"></p>
    <div class="dialog-actions">
      <button class="btn btn-ghost" id="dialog-cancel">取消</button>
      <button class="btn btn-danger" id="dialog-confirm">确认</button>
    </div>
  </div>
</div>

<div id="lightbox" class="lightbox hidden">
  <button id="lightbox-close" class="lightbox-close" title="关闭">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
  <div class="lightbox-nav lightbox-prev" id="lightbox-prev">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
  </div>
  <img id="lightbox-img" class="lightbox-img" alt="">
  <video id="lightbox-video" class="lightbox-img" controls playsinline style="display:none"></video>
  <div class="lightbox-nav lightbox-next" id="lightbox-next">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
  </div>
  <div class="lightbox-spinner" id="lightbox-spinner">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>
  </div>
  <div class="lightbox-name" id="lightbox-name"></div>
  <div class="lightbox-toolbar" id="lightbox-toolbar">
    <button id="lightbox-dl" class="lightbox-btn" title="下载">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </button>
    <button id="lightbox-del" class="lightbox-btn lightbox-btn-danger" title="删除">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
    </button>
  </div>
</div>

<script src="/static/js/app.js"></script>
<div class="grain"></div>
</body>
</html>
